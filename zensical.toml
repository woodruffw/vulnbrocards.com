[project]
site_url = "https://vulnbrocards.com/"
site_name = "Vulnerability brocards"
site_description = "Brocards for triaging vulnerability reports"
site_author = "William Woodruff"
copyright = "Copyright &copy; 2026 William Woodruff"
repo_url = "https://github.com/woodruffw/vulnbrocards.com"
repo_name = "woodruffw/vulnbrocards.com"

[[project.nav]]
Welcome = "index.md"

[[project.nav]]
"How to use" = "how-to-use.md"

[[project.nav]]
Brocards = [
  "brocards/index.md",
  { "No vulnerability report without a threat model" = "brocards/vb001-no-vuln-report-without-threat-model.md" },
  { "No exploit from the heavens" = "brocards/vb002-no-exploit-from-heavens.md" },
  { "No vulnerability outside of usage" = "brocards/vb003-no-vuln-outside-of-usage.md" },
  { "No vulnerability from standard behavior" = "brocards/vb004-no-vuln-from-standard-behavior.md" },
  { "No vulnerability from documented behavior" = "brocards/vb005-no-vuln-from-documented-behavior.md" },
  { "No cure worse than the disease" = "brocards/vb006-no-cure-worse-than-disease.md" },
  { "The report is neither necessary nor sufficient" = "brocards/vb007-report-neither-necessary-nor-sufficient.md" },
]

[[project.nav]]
"Other resources" = "resources.md"

[project.theme]
favicon = "assets/scale.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]
icon.repo = "fontawesome/brands/github"
logo = "assets/scale.png"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/woodruffw/vulnbrocards.com"

[[project.extra.social]]
icon = "fontawesome/brands/mastodon"
link = "https://infosec.exchange/@yossarianr"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
